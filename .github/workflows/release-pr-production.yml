name: Create release PR (main -> production)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch production
        run: git fetch origin production

      - name: Check for incoming commits
        id: incoming
        run: |
          if [ -z "$(git log origin/production..origin/main)" ]; then
            echo "Nothing to release — origin/production is up to date with origin/main."
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort when nothing to release
        if: steps.incoming.outputs.no_changes == 'true'
        run: exit 1

      - name: Build PR body
        id: body
        run: |
          {
            echo "## Summary"
            echo ""
            echo "Merge latest changes from \`main\` into \`production\` for the upcoming release."
            echo ""
            echo "## Incoming commits"
            echo ""
            git log --reverse --pretty=format:"- \`%h\` %s" origin/production..origin/main
            echo ""
            echo ""
            echo "## Verification checklist"
            echo ""
            echo "- [ ] \`pnpm test\` passes."
            echo "- [ ] \`pnpm lint\` is clean."
            echo "- [ ] Release branch diff reviewed for unexpected changes."
            echo "- [ ] No new console errors or broken network requests introduced."
          } > /tmp/release-pr-body.md
          echo "Created body with $(git log --oneline origin/production..origin/main | wc -l | tr -d ' ') incoming commit(s)"

      - name: Find existing release PR
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list --base production --head main --state open \
            --search 'in:title "Release: Merge main into production"' --json number --jq '.[0].number')
          echo "pr_number=${PR_NUMBER:-}" >> "$GITHUB_OUTPUT"

      - name: Create release PR
        if: steps.find.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base production --head main \
            --title "Release: Merge main into production" \
            --body-file /tmp/release-pr-body.md

      - name: Update existing release PR
        if: steps.find.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ steps.find.outputs.pr_number }}" --body-file /tmp/release-pr-body.md
